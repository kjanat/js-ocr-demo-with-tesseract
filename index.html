<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- SEO Meta Tags -->
  <title>OCR Web App - Extract Text from PDF with JavaScript</title>
  <meta name="description" content="Modern web-based OCR application using Tesseract.js and PDF.js. Extract text from PDF documents directly in your browser with advanced optical character recognition.">
  <meta name="keywords" content="OCR, PDF, Tesseract.js, JavaScript, text extraction, optical character recognition">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg">

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 dark:text-white min-h-screen">
  <!-- Header -->
  <header class="bg-white dark:bg-gray-800 shadow-md">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-gradient-to-br from-primary-500 to-primary-600 p-2 rounded-lg shadow-lg">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white">OCR Web App</h1>
          <p class="text-sm text-gray-600 dark:text-gray-400">Extract text from PDF documents</p>
        </div>
      </div>

      <button
        id="darkModeToggle"
        class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-all duration-300">
        Dark Mode
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-6 h-[calc(100vh-120px)]">
    <div class="flex flex-col lg:flex-row gap-6 h-full">

      <!-- Left Panel - PDF Viewer -->
      <div class="flex-1 flex flex-col bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 transition-all duration-300">
        <div class="mb-4">
          <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-2 flex items-center">
            <svg class="w-6 h-6 mr-2 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
            </svg>
            PDF Document
          </h2>
          <p class="text-sm text-gray-600 dark:text-gray-400">Upload a PDF file to extract text</p>
        </div>

        <!-- PDF Viewer Container -->
        <div id="pdfViewer" class="flex-grow rounded-lg border-2 border-gray-200 dark:border-gray-700 mb-4 flex items-center justify-center overflow-auto transition-colors duration-300">
          <div class="text-center p-8">
            <svg class="w-24 h-24 mx-auto text-gray-300 dark:text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
            </svg>
            <canvas id="canvas" class="hidden"></canvas>
            <p class="text-gray-500 dark:text-gray-400 text-lg" id="placeholder-text">No PDF loaded</p>
            <p class="text-gray-400 dark:text-gray-500 text-sm mt-2">Upload a PDF file to get started</p>
          </div>
        </div>

        <!-- Navigation Controls -->
        <div class="flex items-center justify-between gap-4 mb-4">
          <div class="flex gap-2 flex-1">
            <button
              id="prev"
              class="flex-1 px-4 py-3 bg-primary-500 text-white rounded-lg hover:bg-primary-600 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 font-medium shadow-md flex items-center justify-center">
              <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
              </svg>
              Previous
            </button>
            <button
              id="next"
              class="flex-1 px-4 py-3 bg-primary-500 text-white rounded-lg hover:bg-primary-600 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 font-medium shadow-md flex items-center justify-center">
              Next
              <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
              </svg>
            </button>
          </div>
          <div
            id="pagination"
            class="hidden bg-gray-100 dark:bg-gray-700 px-4 py-3 rounded-lg text-gray-700 dark:text-gray-300 font-medium whitespace-nowrap">
            Page <span id="page_num" class="font-bold text-primary-600 dark:text-primary-400">1</span> of <span id="page_count" class="font-bold text-primary-600 dark:text-primary-400">1</span>
          </div>
        </div>

        <!-- File Upload -->
        <div class="relative">
          <input
            type="file"
            id="uploadPDF"
            name="uploadPDF"
            accept="application/pdf"
            class="hidden"
          />
          <label
            for="uploadPDF"
            class="block w-full p-4 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 cursor-pointer transition-all duration-300 text-center group">
            <div class="flex items-center justify-center">
              <svg class="w-6 h-6 mr-2 text-primary-500 group-hover:text-primary-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
              </svg>
              <span class="text-gray-700 dark:text-gray-300 font-medium">Choose a PDF file or drag and drop</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Right Panel - Extracted Text -->
      <div class="flex-1 flex flex-col bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 transition-all duration-300">
        <div class="mb-4">
          <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-2 flex items-center">
            <svg class="w-6 h-6 mr-2 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            Extracted Text
          </h2>
          <p class="text-sm text-gray-600 dark:text-gray-400">OCR results will appear here</p>
        </div>

        <textarea
          id="extracted-text"
          class="flex-grow w-full rounded-lg border-2 border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 p-4 focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-300"
          placeholder="Extracted text will appear here..."
          spellcheck="false"
        ></textarea>

        <div class="mt-4 flex gap-2">
          <button
            id="copyText"
            class="flex-1 px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-all duration-200 font-medium shadow-md flex items-center justify-center"
            onclick="navigator.clipboard.writeText(document.getElementById('extracted-text').value)">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
            Copy Text
          </button>
          <button
            id="clearText"
            class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-all duration-200 font-medium shadow-md flex items-center justify-center"
            onclick="document.getElementById('extracted-text').value = ''">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white dark:bg-gray-800 shadow-md mt-6">
    <div class="container mx-auto px-4 py-4 text-center text-gray-600 dark:text-gray-400 text-sm">
      <p>Powered by <a href="https://tesseract.projectnaptha.com/" target="_blank" class="text-primary-500 hover:text-primary-600 font-medium">Tesseract.js</a> and <a href="https://mozilla.github.io/pdf.js/" target="_blank" class="text-primary-500 hover:text-primary-600 font-medium">PDF.js</a></p>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
